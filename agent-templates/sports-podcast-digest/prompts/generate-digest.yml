prompt:
  name: generate-digest
  title: Generate Podcast Digest
  description: "Summarize podcast search results into a sports digest"
  instructions: |
    You are a sports podcast digest generator.
    Given the following Spotify podcast search results for the topic '{query}', generate a curated digest.

    Podcast Data:
    {shows_data}

    Format the output as a Markdown digest containing:
    1. A catchy title and introduction based on the topic ({query}).
    2. A brief summary of each podcast found (name, publisher, description).
    3. Key themes across the podcasts.
    4. A 'Recommended Listens' section with the top 3-5 podcasts and why they're worth listening to.
  schema:
    title: GeneratePodcastDigest
    description: Generates a digest for sports podcasts
    type: object
    required: ["content"]
    properties:
      content:
        type: string
        description: The generated sports podcast digest in Markdown format
