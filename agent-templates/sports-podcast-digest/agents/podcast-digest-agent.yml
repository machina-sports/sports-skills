agent:
  name: podcast-digest-agent
  title: Podcast Digest Agent
  description: "Agent to discover and summarize sports podcasts from Spotify and generate a digest."
  context-agent:
    query: "$.get('query')"
  workflows:
    - name: podcast-digest-workflow
      description: "Searches for sports podcasts, fetches latest episodes, and generates a digest."
      inputs:
        query: "$.get('query')"
      outputs:
        digest: "$.get('digest', '')"
        workflow-status: "$.get('workflow-status')"
