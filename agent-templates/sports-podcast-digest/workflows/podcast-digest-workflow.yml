workflow:
  name: podcast-digest-workflow
  title: Podcast Digest Workflow
  description: Searches for sports podcasts and generates a digest from the results.
  context-variables:
    spotify-podcasts:
      basicAuth: "$TEMP_CONTEXT_VARIABLE_SPOTIFY_BEARER_TOKEN"
    google-genai:
      api_key: "$TEMP_CONTEXT_VARIABLE_GOOGLE_GENERATIVE_AI_API_KEY"
  inputs:
    query: "$.get('query')"
  outputs:
    digest: "$.get('digest', '')"
    workflow-status: "$.get('digest', '') != ''"
  tasks:
    - name: search-podcasts
      type: connector
      description: "Search for sports podcasts matching the user's query"
      connector:
        name: spotify-podcasts
        command: get-search
      inputs:
        q: "$.get('query') + ' podcast'"
        type: "'show'"
        market: "'US'"
        limit: 10
      outputs:
        shows: "$.get('shows', {}).get('items', [])"

    - name: generate-digest
      type: prompt
      description: "Generate a sports podcast digest from the search results"
      condition: "len($.get('shows', [])) > 0"
      connector:
        name: google-genai
        command: invoke_prompt
        model: gemini-2.5-flash
      inputs:
        query: "$.get('query')"
        shows_data: "$.get('shows', [])"
      outputs:
        digest: "$.get('content', '')"
